; ============================================================================
; GPS 引脚方向 / 波特率 诊断固件
; 目的: 用实测判定 GPS 的 RX/TX 到底该接哪两个 GPIO, 以及正确波特率。
;       不依赖推理, 直接看哪个组合能收到 NMEA。
; ============================================================================
[env:gpsdiag]
platform = file://D:/meshtastic-build/pio-core/platforms/espressif32@src-dabc7c9195e5e9fb575450207338ba15

board = tmesh-s3-e22
framework = arduino
board_build.partitions = default_8MB.csv

monitor_speed = 115200
upload_speed = 921600

build_flags =
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1
