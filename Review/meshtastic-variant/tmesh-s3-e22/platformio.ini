; ============================================================================
; T-mesh — Meshtastic board variant
; 复制版 Waveshare ESP32-S3-Pico (ESP32-S3 N8R2: 8MB flash / 2MB Quad PSRAM)
; + Ebyte E22-900M33S (2W)     ★ 是 33S, 不是 30S —— 见下方功率说明
; ============================================================================
; 硬件依据:
;   [主控模块原理图] Review/hardware-schematic/pico-clone-*.png (设计者提供)
;     - U4 = W25Q64JVZPIQ / W25Q128JVPIQ, "SMD WSON8 (6*5)"
;       -> 标准 Quad SPI flash (8 脚 WSON), 不是 16 脚 Octal PSRAM 封装
;     - 原理图上【无独立 PSRAM 芯片】-> 2MB PSRAM 在 ESP32-S3 die 内 (R2)
;     => Quad flash + Quad PSRAM
;     - 是【复制版】Pico, 不是原版 Waveshare
;     - WS2812 RGB 在 GPIO21 (原理图 LE1 + R15 10K)
;     - CH340/CH343P 接 UART0, Q1/Q2 (SS8050) 做 DTR/RTS 自动复位
;   [载板] PCB/Netlist_Schematic1_1_2026-10-14.tel
;          PCB/Gerber_PCB1_1_2026-09-06.zip -> FlyingProbeTesting.json (386 焊盘网络表)
;
; ★ 射频 TX/RX 切换:
;   本板【没有】把 E22 的 TXEN/RXEN 接到 MCU GPIO。而是:
;       E22 DIO2 ──┬── U4 跳线(默认短接) ─────> E22 TXEN
;                  └── U3 (SN74LVC1G14 反相器) ─> E22 RXEN
;   因此 MCU 完全不参与射频开关控制, 必须让 SX1262 自己驱动 DIO2。
;   对应宏: SX126X_DIO2_AS_RF_SWITCH  (见 variant.h)
;
;   对照参考:
;     variants/esp32s3/t-beam-1w/variant.h           -> 也是 DIO2_AS_RF_SWITCH + 外部 PA
;     variants/esp32s3/diy/t-energy-s3_e22/variant.h -> 同为 E22, 但它走 MCU 直控
;                                                        (SX126X_TXEN / SX126X_RXEN)
;                                                        本板【不可】照抄那两个宏!
;
; ★★ 发射功率 —— 本板装的是 E22-900M33S (2W), 不是 30S ★★
;
; 两者对【射频芯片输入功率】的要求差 14 dB, 配错会打坏内部 PA:
;
;   E22-900M33S  ← 本板实际装配的模块
;                最大 33 dBm, 发射电流 1200 mA
;                datasheet 明确: "The output power of the RF chip
;                cannot be greater than 9dBm"   ← 超了会烧 PA
;                -> Meshtastic: TX_GAIN_LORA 25 / SX126X_MAX_POWER 8
;
;   E22-900M30S  最大 30.0 dBm, 发射电流 650 mA
;                datasheet【无】芯片输入限制 -> 芯片可到 +22dBm
;                -> Meshtastic: TX_GAIN_LORA 7 / SX126X_MAX_POWER 22
;
; ★ 为什么 33S 反而要【压低】芯片功率: 它的 PA 增益高达 25 dB。
;   芯片给 8dBm -> 模块出 33dBm (8+25)。若错用 30S 的表 (增益按 7 算),
;   芯片会被推到 22dBm, 远超其 9dBm 输入上限 —— 直接超出 13 dB。
;   型号里的数字不是增益, 别被 30S/33S 的命名误导。
;
; ★ 33S 的发射电流 1200 mA 是 30S (650 mA) 的近两倍。请重新核算供电:
;   本板 MP2482 降压模块与 470uF 储能原按 650 mA 设计, 1.2A 需要确认余量。
;
; ★ 2 W 在多数地区需要许可 / 受功率与占空比限制。确认当地法规后再放开。
;
; 参考: https://www.cdebyte.com/products/E22-900M33S/1#Parameters
; 参考: https://github.com/wzqvip/ESP32S3-SX1262-Meshtatics-Station
; ============================================================================

[env:tmesh-s3-e22]
extends = esp32s3_base

board = tmesh-s3-e22

; DIY 变体: 不占用官方 hw_model 编号, 不进默认构建
board_level = extra

; ★ 必须用【自建板级 JSON】(boards/tmesh-s3-e22.json), 不能用 esp32-s3-pico。
;   原因: platform-espressif32 的 builder/frameworks/espidf.py:3089 是这样选
;   预编译 IDF 库的:
;       mem_var = arduino_libs / chip_variant / board.get("build.arduino.memory_type",
;                                                         flash_mode + "_qspi")
;   它读【板级 JSON】, 不读 platformio.ini。
;   自建 JSON 同时把 flash 容量按 8MB 配好, 避免 16MB 分区表刷到 8MB 芯片上。
;
; ★ N8R2 = 8MB flash, 8MB 分区表已在板级 JSON 里指定 (default_8MB.csv)
;
; ★★ 板级 JSON 里【不声明任何 PSRAM】—— 这是修启动崩溃的关键, 别加回去 ★★
;   曾经在 JSON 里写 memory_type=qio_qspi, 现已删除。原因见下方。

; ⚠️ 这里【刻意不设】board_build.arduino.memory_type。
;
; 原因 (排查了很久才搞清楚, 详见 Review/PSRAM-FIX-SOLVED.md):
;   Meshtastic 的板级配置生成器 (platform-espressif32 的
;   builder/frameworks/espidf.py::generate_board_specific_config) 只要看到
;   板级 JSON 声明了 PSRAM (BOARD_HAS_PSRAM / psram_type / memory_type),
;   就会强制写入 CONFIG_SPIRAM=y —— 连 sdkconfig.defaults 都会被它覆盖。
;
;   而本板这颗 ESP32-S3R2 的 PSRAM 在 bootloader 阶段初始化会失败:
;       E (407) octal_psram: PSRAM chip is not connected, or wrong PSRAM line mode
;       Guru Meditation Error -> 无限重启, setup() 从未执行
;
;   所以自建板级 JSON (boards/tmesh-s3-e22.json) 里【去掉了全部 PSRAM 声明】,
;   让 CONFIG_SPIRAM 保持关闭 -> bootloader 不再碰 PSRAM -> 正常启动。
;
;   代价: 应用运行时也用不到那 2MB PSRAM (Free PSRAM: 0),
;         TrafficManagement 缓存相应缩小。功能不受影响。
;
;   曾经在这里写 memory_type=qio_qspi 是【无效的】—— espidf.py:3089 选库时
;   读的是板级 JSON 而非 platformio.ini, 所以那行既没生效、又有误导性, 已删除。

; ESP32-S3-Pico 通过原生 USB-CDC 做串口/烧录。
; ARDUINO_USB_MODE=1   = 使用内置 USB-OTG 外设 (Hardware USB)
; ARDUINO_USB_CDC_ON_BOOT=1 = Serial 映射到 USBSerial
; 两者必须成对出现: 只定义 CDC_ON_BOOT 而 USBSerial 不存在,
; 会导致 Arduino core 报 "'USBSerial' was not declared in this scope"。
build_flags =
  ${esp32s3_base.build_flags}
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -I variants/esp32s3/diy/tmesh-s3-e22
  -D TMESH_S3_E22

  ; E22-900M33S 功率映射表 (src/configuration.h 内置)
  ; ★ 本板装的是 33S, 必须用这个宏, 不能用 EBYTE_E22_900M30S
  ;   (30S 的表会把芯片推到 22dBm, 远超 33S 的 9dBm 输入上限)
  -D EBYTE_E22_900M33S

  ; ★ 射频诊断日志。
  ;   "Set DIO2 as RF switch, result: N" 这行是 LOG_DEBUG_RADIO, 由 RADIO_DEBUG
  ;   控制, 默认 0 —— 关闭时会被编译期直接消掉 ("costs no flash when off"),
  ;   所以标准构建里【看不到】这行。首次上板验证射频时打开它。
  -D RADIO_DEBUG=1

  ; ★ 首次上电请打开这一行, 把发射功率封到很小的值 (见 variant.h 说明)
  ; 验证完射频和电源之后再注释掉。
  -D TMESH_LOW_POWER_TEST

; ★ PCF8563 RTC 所需的库。
;   启用 PCF8563_RTC 后 src/gps/RTC.cpp 会用到 PCF8xRTC 类, 而它不随
;   esp32s3_base 带进来 —— 不加这个依赖会报
;       error: 'PCF8xRTC' was not declared in this scope
;   版本/commit 与上游 t-watch-s3、tbeam-s3-core 保持一致。
lib_deps =
  ${esp32s3_base.lib_deps}
  # renovate: datasource=git-refs depName=meshtastic-PCF8xRTC packageName=https://github.com/meshtastic/PCF8xRTC gitBranch=main
  https://github.com/meshtastic/PCF8xRTC/archive/efe1d9c92f79d8413f8ac4e9bdce0c48410600de.zip
