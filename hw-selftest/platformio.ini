; ============================================================================
; T-mesh 硬件自检 (unit test)
; 独立于 Meshtastic 的最小工程, 用于逐个验证板上部件。
;
; 为什么要独立: Meshtastic 的构建体系会强制链接它自带的那份 PSRAM 预编译库
; (见 Review/ESP32S3-PSRAM-ISSUE.md), 导致启动即崩。本工程不带那套东西,
; 因此可以判定 "芯片 PSRAM 是否可用" —— 这是当前唯一能区分
; "硬件坏" 与 "Meshtastic 框架问题" 的实验。
;
; 用法:
;   pio run -e selftest -t upload
;   然后 115200 打开串口看结果
; ============================================================================
[env:selftest]
; ★ 复用 Meshtastic 已在用的 pioarduino 平台 (esp32 55.03.312)。
;   用本地路径引用, 因为带 hash 的目录名不能直接写进 platform= (语义版本解析会报错)。
;   也不用 platformio/espressif32@6.13.0 —— 那套要额外下载工具链, 且其 esptool
;   依赖 intelhex, 在离线/受限网络下会失败。
platform = file://D:/meshtastic-build/pio-core/platforms/espressif32@src-dabc7c9195e5e9fb575450207338ba15

board = tmesh-s3-e22
framework = arduino
board_build.partitions = default_8MB.csv

monitor_speed = 115200
upload_speed = 921600

build_flags =
  -D ARDUINO_USB_MODE=1
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D CORE_DEBUG_LEVEL=3
  ; PSRAM 自检开关: 1 = 启用 PSRAM 并检查; 0 = 不启用
  -D SELFTEST_ENABLE_PSRAM=1

lib_deps =
  ; 仅用于点亮自检, 极轻量。离线取不到会自动跳过该测试 (代码里有 __has_include 兜底)
  adafruit/Adafruit NeoPixel@1.12.3
